[package]
name = "tianshu-relay-core"
description = "TianshuRelay 核心：站点适配器、agent 注入器、钥匙串与本地存储（不依赖 Tauri）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1.92"
axum = "0.8.9"
# M42-S1：413 判定要 downcast `LengthLimitError`；它早就在 Cargo.lock 里（axum 的传递依赖），
# 这里只是让它变成可直接引用的类型（不新增任何 crate 下载）。
http-body = "1"
http-body-util = "0.1.5"
pin-project-lite = "0.2"
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
keyring = "4"
pbkdf2 = "0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "socks", "gzip", "stream"] }
rsa = { version = "0.9.10", features = ["sha2", "pem", "getrandom"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml_edit = "0.25.5"
# M7-S0：提升为直接依赖。它**本来就在** Cargo.lock（rsa / aes-gcm 的传递依赖）与本机缓存里，
# 因此不引入新的第三方代码、也不需要联网。用途见 docs/specs/M7-S0-V1.1波次章程.md §3.1（网关明文键）
# 与 docs/specs/M7-S5-接线与运行时.md §2.1（内存清零）。
zeroize = "1.9"

[dev-dependencies]
# 集成测试直接开库制造故障（例如 DROP TABLE journals）验证补偿路径
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.23.1"
rsa = { version = "0.9.10", features = ["sha2", "pem", "getrandom"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
