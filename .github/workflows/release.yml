name: release

# 更新线：打 v* 标签即发版。
# 客户端（Settings → 更新，UpdateChecker）读
#   https://github.com/lorek666/keyrelay/releases/latest/download/latest.json
# 该文件由 tauri-action 随 Release 自动生成并上传。
#
# 前置条件（缺一不可，否则签名步骤失败）：
#   1. Secrets.TAURI_SIGNING_PRIVATE_KEY：须与 src-tauri/tauri.conf.json 里
#      updater.pubkey 配对的 minisign 私钥（现仓库 Secrets 为空，未配置）。
#      若原私钥已丢失，须重新生成密钥对并同步换掉 pubkey（见下方注意）。
#   2. 仓库公开后 updater 才能匿名拉取——私有仓的 release 附件下载需身份验证。
#
# 发版规矩：
#   - 标签只从 CI 全绿的 main 上切；发版前先把 tauri.conf.json 的 version
#     升到与标签一致的版本（manifest 里的版本号取自应用配置，不是标签名）。
#   - 首个 Release 务必核对 latest.json 的平台键：macOS 走 universal 产物，
#     须确认 updater 能认到对应平台条目，否则再拆双架构构建。
# 注意（私钥丢失时的先有鸡后有蛋）：
#   已装机的旧客户端只认旧 pubkey；换新密钥对后，旧客户端收不到新版提示，
#   须靠一次手动安装（去 Release 页下载）才能让新 pubkey 生效。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（须已存在，如 v0.2.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-${{ hashFiles('Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "天枢 Relay ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin

  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ hashFiles('Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "天枢 Relay ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
