name: ci-macos

# M14-S5：macOS 六门禁 CI + 分架构构建。
# build-macos job（矩阵：aarch64/x86_64）每架构单独出 .app/.dmg 并各自断言 ≤30MB（PRD §5）；
# 2026-10-26 起替代 Universal（通用包 50 MiB 天生超标）。

on:
  push:
    branches: [main, "m14/**"]
  pull_request:
  workflow_dispatch:

env:
  CI: "true"

permissions:
  contents: read

jobs:
  gate-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ hashFiles('Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      # M24-S2 / B-73：门禁取数前置守护。
      # 性质要说清：这是**自证（self-proof）**——干净检出上它**必然**通过，拦不住任何东西；
      # 它证明的是「下面这些门禁数字属于这次提交的内容」（B-43 的原始事故只发生在本地脏树）。
      - run: node scripts/check-clean-gate.mjs

      # 六门禁（macOS 侧）
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/check-commands.mjs
      # M23-S3 / B-180：章程 ↔ 产物齐全性守护。单独一步、不并进 `pnpm test`，
      # 是为了让 CI 日志里这一路**有自己的一行**——并进去会被 vitest 的输出冲掉，
      # 红了也看不出是哪一条守护。本地 `pnpm test` 已含它，这一步是冗余的保险。
      - run: node scripts/check-charter-steps.mjs

  # 分架构 macOS 构建：每架构单独出 .app/.dmg，各自断言 ≤30MB（PRD §5）。
  build-macos:
    needs: gate-macos
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      # 分架构构建 + 体积断言（脚本内含 ≤30MB 检查，>30MB 退出 1 → job 红）。
      # 签名密钥沿用 5e1a986f 的做法：updater 公钥已配置时 tauri build 缺私钥会失败。
      - run: bash scripts/build-macos.sh ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: tianshu-relay-macos-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn
