# 临时诊断 round 3：验证 build.rs 的 v6 清单是否真进了 CI 编出的测试 exe，并跑通 commands 目标。
# 仅 workflow_dispatch 手动触发，不参与任何门禁；定位到根因后删除本文件。
name: diag-commands

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Build commands test exe without running
        run: cargo test --no-run -p tianshu-relay --test commands
      - name: Check embedded manifest + list + run target
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/debug/deps/commands-*.exe | Select-Object -First 1 -ExpandProperty FullName
          Write-Output "exe: $exe"
          $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Output "--- embedded manifest (expect Common-Controls 6.0.0.0) ---"
          & $mt -inputresource:"$exe;#1" -out:embedded.xml 2>&1 | Select-Object -First 2
          if (Test-Path embedded.xml) { Get-Content embedded.xml -Raw }
          Write-Output "--- --list (first 5) ---"
          & $exe --list 2>&1 | Select-Object -First 5
          Write-Output "list exit: $LASTEXITCODE"
      - name: Run commands test target
        shell: pwsh
        run: |
          cargo test -p tianshu-relay --test commands 2>&1 | Tee-Object -FilePath commands-out.txt | Select-Object -Last 5
          Write-Output "--- FAILED lines ---"
          Select-String -Path commands-out.txt -Pattern 'FAILED|panicked|test result' | Select-Object -ExpandProperty Line | Select-Object -First 30
